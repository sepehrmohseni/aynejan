# آینه‌جان — aynejan.sepehrmoh97.ir
# فایل استاتیک، بدون بک‌اند. TLS با همان گواهی wildcard کلودفلیر.
# این بلوک‌ها با نام دامنه match می‌شوند و به default_server پورتفولیو دست نمی‌زنند.

server {
    listen 80;
    listen [::]:80;
    server_name aynejan.sepehrmoh97.ir;

    # اگر کلودفلیر روی حالت Flexible باشد، از پورت ۸۰ می‌آید؛
    # پس همین‌جا هم سرو می‌شود تا دمو در هر دو حالت کار کند.
    include /etc/nginx/snippets/aynejan-app.conf;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name aynejan.sepehrmoh97.ir;

    ssl_certificate     /etc/ssl/cloudflare/sepehrmoh97.ir.pem;
    ssl_certificate_key /etc/ssl/cloudflare/sepehrmoh97.ir.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    include /etc/nginx/snippets/aynejan-app.conf;
}
