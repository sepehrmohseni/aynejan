# بدنهٔ مشترک هر دو بلوک آینه‌جان.
root /var/www/aynejan/current;
index index.html;

charset utf-8;
client_max_body_size 4m;

# نوع درست فایل‌های مدل و wasm
types {
    text/html                 html;
    text/css                  css;
    application/javascript    js mjs;
    application/json          json map;
    application/wasm          wasm;
    image/svg+xml             svg;
    image/png                 png;
    image/jpeg                jpg jpeg;
    image/webp                webp;
    font/woff2                woff2;
    font/woff                 woff;
    font/ttf                  ttf;
    application/vnd.ms-fontobject eot;
    text/plain                txt;
    application/octet-stream  task tflite bin;
}
default_type application/octet-stream;

# فایل‌های .gz که هنگام انتشار ساخته شده‌اند مستقیم سرو می‌شوند
gzip_static on;
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_types text/css text/plain application/javascript application/json image/svg+xml application/wasm;

# wasm و مدل‌ها: حجیم و عملاً ثابت
location /mediapipe/ {
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "public, max-age=2592000" always;
    try_files $uri =404;
}

# خروجی Vite با هش نسخه — تا ابد قابل کش
location /assets/ {
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "public, immutable, max-age=31536000" always;
    try_files $uri =404;
}

# SPA: هر مسیر ناشناخته به index.html
location / {
    # دوربین فقط برای خود این مبدأ مجاز است
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /index.html;
}
